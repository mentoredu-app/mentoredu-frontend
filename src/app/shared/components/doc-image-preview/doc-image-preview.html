<div class="doc-preview">

  <!-- Imagen -->
  <div class="doc-preview__img-wrap">
    @if (!imgLoaded()) {
      <div class="doc-preview__skeleton"></div>
    }
    @if (!imgError()) {
      <img class="doc-preview__img"
        [class.doc-preview__img--visible]="imgLoaded()"
        [src]="resolvedUrl()"
        [alt]="label()"
        (load)="onLoad()"
        (error)="onError()" />
    } @else {
      <div class="doc-preview__fallback">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span>No se pudo cargar la imagen</span>
      </div>
    }
  </div>

  <!-- Footer -->
  <div class="doc-preview__footer">
    <span class="doc-preview__label">{{ label() }}</span>
    <div class="doc-preview__actions">
      <button class="doc-preview__btn" type="button" (click)="openInNewTab()" title="Abrir en nueva pestaña">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Ver
      </button>
      <button class="doc-preview__btn doc-preview__btn--primary" type="button" (click)="download()" title="Descargar imagen">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Descargar
      </button>
    </div>
  </div>

</div>
